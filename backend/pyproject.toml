[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shixu-backend"
version = "0.1.0"
description = "Shixu backend contract and application foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.18.4",
  "argon2-cffi==25.1.0",
  "fastapi==0.136.1",
  "pydantic==2.13.2",
  "pydantic-settings==2.14.1",
  "psycopg[binary]==3.3.4",
  "sqlalchemy==2.0.49",
  "uvicorn==0.47.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.3", "ruff==0.15.20"]
speech = ["faster-whisper>=1.2,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
