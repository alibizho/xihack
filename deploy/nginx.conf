server {
    listen 80;
    listen [::]:80;
    server_name jianwenjiuzhou.cloud www.jianwenjiuzhou.cloud;
    return 301 https://jianwenjiuzhou.cloud$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jianwenjiuzhou.cloud www.jianwenjiuzhou.cloud;
    ssl_certificate /etc/letsencrypt/live/jianwenjiuzhou.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jianwenjiuzhou.cloud/privkey.pem;
    if ($host = www.jianwenjiuzhou.cloud) {
        return 301 https://jianwenjiuzhou.cloud$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 240s;
        client_max_body_size 1m;
    }
}
